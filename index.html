<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Privateers</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230f3f52'/><g transform='rotate(40 16 16)'><path d='M16 2.5C21.5 8 22 19 20 29.5h-8C10 19 10.5 8 16 2.5z' fill='%23a46c3b' stroke='%237a4a26' stroke-width='1.2'/><rect x='8.5' y='11' width='15' height='3.2' rx='1.6' fill='%23efe3c4'/><rect x='10' y='19' width='12' height='3' rx='1.5' fill='%23efe3c4'/></g></svg>">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Barlow+Semi+Condensed:wght@500;600;700&family=Noto+Serif+TC:wght@600&family=Noto+Sans+TC:wght@500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="game"></div>

<div id="hud">
  <div class="bars">
    <div class="bar hp"><i id="hpFill"></i><span><em data-i18n="hull">Hull</em><em id="hpTxt">100</em></span></div>
    <div class="bar cargo" id="cargoBar"><i id="cargoFill"></i><span><em data-i18n="cargo">Cargo</em><em id="cargoTxt">0 / 150</em></span></div>
    <button class="lang" id="langHud" type="button" data-lang-toggle>中文</button>
  </div>
  <div class="side">
    <div class="purse"><small data-i18n="gold">Gold</small><b id="gold">0</b></div>
    <canvas id="mini" width="224" height="224"></canvas>
    <div id="lv">Ship Lv 1</div>
  </div>
</div>
<div id="hint"></div>
<div id="toast"></div>
<div id="joy" hidden><i></i></div>

<div id="port" hidden>
  <div class="sheet" role="dialog" aria-labelledby="portTitle">
    <header>
      <div><div class="eyebrow" data-i18n="ledger">Harbor ledger</div><h1 id="portTitle" data-i18n="harbor">Safe Harbor</h1></div>
      <div class="gold-big"><span class="eyebrow" data-i18n="gold">Gold</span><b id="pGold">0</b></div>
    </header>
    <p class="msg" id="pMsg"></p>
    <div class="stats" id="pStats"></div>
    <section>
      <h2 data-i18n="broadside">Broadside</h2>
      <p class="hint-s" data-i18n="slotHint">Tap a gun port to swap in another cannon you own.</p>
      <div class="deck" id="deck"></div>
    </section>
    <section>
      <h2 data-i18n="armory">Armory</h2>
      <div class="list" id="armory"></div>
    </section>
    <section>
      <h2 data-i18n="shipwright">Shipwright</h2>
      <div class="list" id="yard"></div>
    </section>
    <section>
      <h2 data-i18n="ships">New ships</h2>
      <p class="hint-s" data-i18n="shipsHint">A new ship starts with hull, sails and hold back at Lv 1. Your cannons move aboard.</p>
      <div class="list" id="ships"></div>
    </section>
    <footer>
      <span style="display:flex;gap:12px;align-items:center"><button class="lang on-sheet" type="button" data-lang-toggle>中文</button>
      <button class="reset" id="reset" type="button" data-i18n="reset">Reset progress</button></span>
      <button class="sail" id="sail" type="button" data-i18n="sail">Set sail</button>
    </footer>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/settings.js"></script>
<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/save.js"></script>
<script src="js/state.js"></script>
<script src="js/world.js"></script>
<script src="js/ships.js"></script>
<script src="js/combat.js"></script>
<script src="js/harbor.js"></script>
<script src="js/hud.js"></script>
<script src="js/main.js"></script>
</body>
</html>
