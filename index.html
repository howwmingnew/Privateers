<style>
/* Layout: full-screen sea canvas, thin HUD strip on top, harbor ledger as a parchment sheet over the sea.
   Single deliberate theme (night-sea + parchment), so no light/dark switch. */
:root {
  --sea: #0f3f52;
  --sea-deep: #08222d;
  --parch: #efe3c4;
  --parch-2: #e0cc9c;
  --ink: #2a1d10;
  --ink-soft: #6b5638;
  --brass: #c08f2e;
  --blood: #b4412c;
  --kelp: #5b9a56;
  --foam: #f6f1e3;
  --f-display: "IM Fell English SC", "Noto Serif TC", "Iowan Old Style", Georgia, serif;
  --f-ui: "Barlow Semi Condensed", "Noto Sans TC", "Microsoft JhengHei", "Arial Narrow", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--sea-deep); color: var(--foam); font-family: var(--f-ui); overflow: hidden; overscroll-behavior: none; }
#game { position: fixed; inset: 0; touch-action: none; }
#game canvas { display: block; }

/* HUD */
#hud {
  position: fixed; top: 0; left: 0; right: 0; z-index: 5; pointer-events: none;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
}
.bars { display: grid; gap: 6px; width: min(46vw, 220px); }
.bar { position: relative; height: 18px; border-radius: 3px; background: rgba(8,34,45,.75); border: 1px solid rgba(246,241,227,.25); overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; width: 100%; transition: width .2s; }
.bar.hp i { background: linear-gradient(#d45a43, var(--blood)); }
.bar.cargo i { background: linear-gradient(#ddb04e, var(--brass)); }
.bar span { position: relative; display: flex; justify-content: space-between; padding: 0 6px; font-size: 12px; line-height: 18px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; text-shadow: 0 1px 2px #000; font-variant-numeric: tabular-nums; }
.bar.full { border-color: var(--brass); box-shadow: 0 0 0 2px rgba(192,143,46,.45); }
.side { display: grid; justify-items: end; gap: 6px; }
.purse { display: flex; gap: 8px; align-items: baseline; background: rgba(8,34,45,.75); border: 1px solid rgba(246,241,227,.25); border-radius: 3px; padding: 2px 8px; }
.purse small { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; opacity: .75; }
.purse b { font-size: 17px; color: #f0c766; font-variant-numeric: tabular-nums; }
.lang { pointer-events: auto; font: inherit; font-size: 13px; font-weight: 700; color: var(--foam); background: rgba(8,34,45,.75);
  border: 1px solid rgba(246,241,227,.35); border-radius: 3px; padding: 3px 9px; cursor: pointer; justify-self: start; }
.lang.on-sheet { color: var(--ink); background: transparent; border-color: rgba(42,29,16,.35); }
#lv { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; opacity: .85; }
#mini { width: 112px; height: 112px; border-radius: 50%; border: 2px solid rgba(192,143,46,.7); background: var(--sea-deep); box-shadow: 0 2px 10px rgba(0,0,0,.4); }

#hint { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); z-index: 5; pointer-events: none;
  font-size: 14px; letter-spacing: .04em; background: rgba(8,34,45,.7); padding: 6px 12px; border-radius: 3px; transition: opacity .6s; width: max-content; max-width: calc(100vw - 32px); text-align: center; }
#toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 92px); transform: translateX(-50%); z-index: 6; pointer-events: none;
  font-family: var(--f-display); font-size: 22px; color: var(--foam); text-shadow: 0 2px 6px #000; opacity: 0; transition: opacity .3s; text-align: center; width: max-content; max-width: calc(100vw - 32px); }
#toast.on { opacity: 1; }

/* Floating joystick */
#joy { position: fixed; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; border: 2px solid rgba(246,241,227,.45); background: rgba(246,241,227,.08); z-index: 4; pointer-events: none; }
#joy i { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(246,241,227,.5); }

/* Harbor ledger */
#port { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: rgba(4,18,24,.55);
  padding-block: calc(env(safe-area-inset-top, 0px) + 12px) calc(env(safe-area-inset-bottom, 0px) + 12px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sheet { width: min(100%, 560px); max-height: 100%; overflow-y: auto; background: var(--parch); color: var(--ink); border-radius: 4px;
  box-shadow: 0 18px 50px rgba(0,0,0,.55), inset 0 0 60px rgba(150,110,50,.25); display: grid; gap: 18px; padding: 20px 20px 0; }
.sheet header { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; border-bottom: 2px solid var(--ink); padding-bottom: 10px; }
.eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); font-weight: 700; }
.sheet h1 { font-family: var(--f-display); font-weight: 400; font-size: 34px; line-height: 1; margin: 2px 0 0; text-wrap: balance; }
.sheet h2 { font-family: var(--f-display); font-weight: 400; font-size: 22px; margin: 0 0 8px; }
.gold-big { text-align: right; }
.gold-big b { display: block; font-size: 26px; color: #8a5d0c; font-variant-numeric: tabular-nums; }
.msg { margin: 0; font-size: 16px; line-height: 1.4; }
.msg em { font-style: normal; font-weight: 700; color: #8a5d0c; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; color: var(--ink-soft); font-weight: 600; font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); }
.hint-s { margin: -4px 0 8px; font-size: 14px; color: var(--ink-soft); }

.deck { display: grid; gap: 6px; }
.deck .row { display: grid; grid-template-columns: 76px 1fr; align-items: center; gap: 8px; }
.deck .lbl { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; color: var(--ink-soft); }
.slots { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.hullbar { height: 26px; margin-left: 84px; border-radius: 4px 50% 50% 4px / 4px 50% 50% 4px; background: linear-gradient(90deg, #7a4a26, #a46c3b); position: relative; }
.hullbar::after { content: ""; position: absolute; left: 8px; right: 30px; top: 11px; height: 4px; background: rgba(255,235,200,.35); }
.slot { font: inherit; font-size: 13px; font-weight: 700; padding: 8px 4px; border-radius: 3px; border: 1.5px solid var(--ink); background: var(--parch-2); color: var(--ink); cursor: pointer; line-height: 1.15; min-width: 0; }
.slot small { display: block; font-weight: 500; font-size: 11px; color: var(--ink-soft); }

.list { display: grid; gap: 8px; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 10px 0; border-top: 1px solid rgba(42,29,16,.25); }
.item:first-child { border-top: 0; }
.item .nm { font-size: 17px; font-weight: 700; }
.item .nm small { font-weight: 600; font-size: 13px; color: var(--ink-soft); margin-left: 6px; }
.item .ds { grid-column: 1; font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.item .ds b { color: var(--ink); }
.item .ds .up { color: #2f6b2b; }
.btn { grid-row: 1 / span 2; grid-column: 2; font: inherit; font-weight: 700; font-size: 15px; min-width: 104px; padding: 9px 12px; border-radius: 3px; cursor: pointer;
  border: 0; background: var(--ink); color: var(--parch); font-variant-numeric: tabular-nums; }
.btn:disabled { background: rgba(42,29,16,.25); color: rgba(42,29,16,.6); cursor: default; }
.btn.max { background: transparent; color: var(--ink-soft); border: 1.5px solid rgba(42,29,16,.3); }
button:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }

.sheet footer { position: sticky; bottom: 0; margin: 0 -20px; padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 0px) * 0); background: linear-gradient(transparent, var(--parch) 30%); display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.sail { font-family: var(--f-display); font-size: 24px; padding: 8px 28px; border: 0; border-radius: 3px; background: var(--blood); color: var(--foam); cursor: pointer; box-shadow: 0 3px 0 #6e2416; }
.sail:active { transform: translateY(2px); box-shadow: 0 1px 0 #6e2416; }
.reset { font: inherit; font-size: 13px; background: none; border: 0; color: var(--ink-soft); text-decoration: underline; cursor: pointer; padding: 6px 0; }

@media (prefers-reduced-motion: reduce) { .bar i, #toast, #hint { transition: none; } }
@media (max-width: 420px) { .deck .row { grid-template-columns: 1fr; } .hullbar { margin-left: 0; } .sheet h1 { font-size: 28px; } }
</style>
</head>

<div id="game"></div>

      <span style="display:flex;gap:12px;align-items:center"><button class="lang on-sheet" type="button" data-lang-toggle>中文</button>
      <button class="reset" id="reset" type="button" data-i18n="reset">Reset progress</button></span>

</div>

// ============================================================

// ---------- Language ----------

  if (vars) for (const k in vars) s = s.split("{" + k + "}").join(vars[k]); return s; }

// ---------- Data tables ----------
const GUNS = {
  six:       { name: "6-pounder",  full: "Iron 6-pounder",   dmg: 10, range: 270, rpm: 36, cost: 0,   upBase: 60,  note: "Reliable all-rounder" },
  long12:    { name: "Long 12",    full: "Long 12-pounder",  dmg: 14, range: 390, rpm: 26, cost: 350, upBase: 140, note: "Outranges most ships" },
  carronade: { name: "Carronade",  full: "24-pdr Carronade", dmg: 30, range: 210, rpm: 22, cost: 600, upBase: 220, note: "Smashes hulls up close" },
  fire:      { name: "Incendiary", full: "Incendiary Gun",   dmg: 7,  range: 260, rpm: 30, cost: 900, upBase: 300, burn: 8, note: "Sets hulls burning for 3 s" },
};
const GUN_ORDER = ["six", "long12", "carronade", "fire"];
const GUN_MAX = 10;

// Ships for sale. Bigger ships carry more guns and start sturdier, but their yard upgrades begin again at Lv 1.
const SHIPS = {
  sloop:    { slots: { bow: 1, left: 1, right: 1, stern: 0 }, hp: 100, speed: 150, hold: 150, cost: 0 },
  schooner: { slots: { bow: 1, left: 2, right: 2, stern: 0 }, hp: 140, speed: 165, hold: 220, cost: 400 },
  brig:     { slots: { bow: 1, left: 3, right: 3, stern: 0 }, hp: 200, speed: 155, hold: 330, cost: 1200 },
  frigate:  { slots: { bow: 2, left: 4, right: 4, stern: 1 }, hp: 300, speed: 150, hold: 500, cost: 3600 },
  line:     { slots: { bow: 2, left: 5, right: 5, stern: 2 }, hp: 450, speed: 140, hold: 750, cost: 9000 },
};
const SHIP_ORDER = Object.keys(SHIPS);
// Gun mounts. ang = firing direction relative to the bow; muzzles sit `out` px that way,
// spread over `span` px along the direction (s.rot + perp).
const MOUNTS = [
  { key: "bow",   ang: 0,            out: 34, perp: Math.PI / 2, span: 12 },
  { key: "left",  ang: -Math.PI / 2, out: 13, perp: 0,           span: 36 },
  { key: "right", ang: Math.PI / 2,  out: 13, perp: 0,           span: 36 },
  { key: "stern", ang: Math.PI,      out: 34, perp: Math.PI / 2, span: 12 },
];

// Yard upgrades scale the current ship's base stats.
const YARD = {
  hull:  { val: (l, sh) => Math.round(sh.hp * 1.28 ** (l - 1)),   show: v => t("u_hp", { n: v }),                cost: l => Math.round(120 * 1.6 ** (l - 1)), max: 15 },
  sails: { val: (l, sh) => sh.speed + 14 * (l - 1),               show: v => t("u_kn", { n: (v / 15).toFixed(1) }), cost: l => Math.round(90 * 1.6 ** (l - 1)),  max: 10 },
  hold:  { val: (l, sh) => Math.round(sh.hold * 1.6 ** (l - 1)),  show: v => t("u_cargo", { n: fmt(v) }),         cost: l => Math.round(100 * 1.7 ** (l - 1)), max: 12 },
};
function yardVal(k, l = save[k], sh = SHIPS[save.ship]) { return YARD[k].val(l, sh); }

function gunLvMul(lv) { return 1.2 ** (lv - 1); }
function gunUpCost(id) { return Math.round(GUNS[id].upBase * 1.55 ** (save.gunLv[id] - 1)); }

// Enemy stats by level L. Merchants are tankier, slower, nearly unarmed, and richer.
function enemyStats(L, merchant) {
  const aim = clamp((L - 1) / (AIM_FULL_L - 1), 0, 1);
  return {
    lead: 0.7 * aim,             // share of the target's motion they aim ahead of
    spread: 0.45 - 0.36 * aim,   // ± random aim error in radians
    hp: 60 * 1.32 ** (L - 1) * (merchant ? 1.25 : 1),
    per: merchant ? 1 : Math.min(1 + Math.floor((L - 1) / 2), 4),
    dmg: 7 * 1.22 ** (L - 1),
    range: 230 + 10 * L,
    interval: 2.6,
    speed: (118 + 6 * L) * (merchant ? 0.85 : 1),
    loot: Math.round(50 * 1.4 ** (L - 1) * (merchant ? 1.7 : 1)),
  };
}
// "Power" = sqrt(hp * dps per side). Used only to show a comparable ship level.
function enemyPower(L) { const s = enemyStats(L, false); return Math.sqrt(s.hp * s.per * s.dmg / s.interval); }
function playerPower() {
  const mountDps = key => save[key].reduce((a, id) => {
    const g = GUNS[id], m = gunLvMul(save.gunLv[id]);
    return a + (g.dmg * m + (g.burn ? g.burn * m * 3 : 0)) * g.rpm / 60;
  }, 0);
  // bow and stern guns bear on a target less often than a broadside, so they count half
  const dps = (mountDps("left") + mountDps("right")) / 2 + (mountDps("bow") + mountDps("stern")) / 2;
  return Math.sqrt(yardVal("hull") * dps);
}
function shipRating() { const p = playerPower(); let L = 1; while (L < 40 && enemyPower(L + 1) <= p) L++; return L; }

// ---------- Save (per-browser convenience only) ----------
// v2 lives under its own key, so an older cached copy of the page can't overwrite it with a fresh v1 save.
const SAVE_KEY = "privateers-save-v2", SAVE_KEY_V1 = "privateers-save-v1";
const defaultSave = () => ({ v: 2, gold: 0, ship: "sloop", hull: 1, sails: 1, hold: 1, unlocked: { six: true },
  gunLv: { six: 1, long12: 1, carronade: 1, fire: 1 }, bow: ["six"], left: ["six"], right: ["six"], stern: [], sunk: 0,
  wrecks: [] });   // the player's own sunken cargo: [{ x, y, value }], kept across sessions
// Give every mount exactly as many guns as the ship has ports, using only guns the captain owns.
function fitMounts(s) {
  const d = defaultSave(), ship = Object.hasOwn(SHIPS, s.ship) ? s.ship : "sloop";
  const unlocked = { ...d.unlocked, ...s.unlocked }, gunLv = { ...d.gunLv, ...s.gunLv };
  const owned = id => Object.hasOwn(GUNS, id) && unlocked[id];
  return { ...s, ship, unlocked, gunLv, ...Object.fromEntries(MOUNTS.map(({ key }) => {
    const old = Array.isArray(s[key]) ? s[key] : [];
    return [key, Array.from({ length: SHIPS[ship].slots[key] }, (_, i) => owned(old[i]) ? old[i] : "six")];
  })) };
}
// v1 sold extra gun ports instead of ships: move each captain onto the ship with as many guns per side,
// keeping their yard levels, so nothing they paid for is lost.
function migrateV1(s) {
  const { ports, ...rest } = s;
  return { ...defaultSave(), ...rest, v: 2, ship: SHIP_ORDER[Math.min(Math.max((ports | 0) - 1, 0), 3)] };
}
function loadSave() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (s && s.v === 2) return fitMounts({ ...defaultSave(), ...s });
    const old = JSON.parse(localStorage.getItem(SAVE_KEY_V1));
    if (old && old.v === 1) return fitMounts(migrateV1(old));
  } catch (e) {}
  return defaultSave();
}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
let save = loadSave();

// ---------- Helpers ----------
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const angDiff = (a, b) => { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const rand = (a, b) => a + Math.random() * (b - a);
function fmt(n) { n = Math.round(n); if (n >= 1e6) return (n / 1e6).toFixed(1) + "M"; if (n >= 1e4) return (n / 1e3).toFixed(1) + "K"; return n.toLocaleString("en-US"); }
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function threatColor(L) { const d = L - shipRating(); return d <= -1 ? "#86c46f" : d === 0 ? "#e8c25a" : d === 1 ? "#e88a3a" : "#d9493a"; }

// Fixed map: same islands for every run.
function genIslands() {
  const r = mulberry32(7), out = [];
  let tries = 0;
  while (out.length < 34 && tries++ < 2000) {
    const R = 60 + r() * 130, x = 150 + r() * (W - 300), y = 150 + r() * (H - 300);
    if (Math.hypot(x - PORT.x, y - PORT.y) < SAFE_R + R + 80) continue;
    if (out.some(o => Math.hypot(o.x - x, o.y - y) < o.r + R + 160)) continue;
    const pts = []; const n = 14;
    for (let i = 0; i < n; i++) pts.push(0.82 + r() * 0.28);
    out.push({ x, y, r: R, pts, seed: r() });
  }
  return out;
}

// ---------- World drawing ----------
function blobPath(g, isl, scale) {
  const n = isl.pts.length; g.beginPath();
  for (let i = 0; i <= n; i++) {
    const a = (i % n) / n * TAU, k = isl.pts[i % n] * isl.r * scale;
    const x = isl.x + Math.cos(a) * k, y = isl.y + Math.sin(a) * k;
    i === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
  }
  g.closePath();
}
// Static scenery is baked into small textures once; a giant live Graphics object would be re-tessellated every frame.
function drawWorld(sc) {
  islands.forEach((isl, idx) => {
    const half = Math.ceil(isl.r * 1.45), loc = { ...isl, x: half, y: half };
    const g = sc.make.graphics({ add: false });
    g.fillStyle(0x5fb3bf, 0.45); blobPath(g, loc, 1.3); g.fillPath();
    g.fillStyle(0xe3cf96, 1); blobPath(g, loc, 1.0); g.fillPath();
    g.fillStyle(0x5b9a56, 1); blobPath(g, loc, 0.72); g.fillPath();
    g.fillStyle(0x3f7a40, 1); blobPath(g, loc, 0.42); g.fillPath();
    const r = mulberry32(Math.floor(isl.seed * 1e6));
    for (let i = 0; i < 3; i++) { const a = r() * TAU, d = r() * isl.r * 0.5; g.fillStyle(0x7d7a72, 1); g.fillCircle(half + Math.cos(a) * d, half + Math.sin(a) * d, 6 + r() * 8); }
    g.generateTexture("isl" + idx, half * 2, half * 2); g.destroy();
    sc.add.image(isl.x, isl.y, "isl" + idx).setDepth(1);
  });
  // Harbor
  const C = DOCK_R + 10, g = sc.make.graphics({ add: false });
  g.lineStyle(3, 0xf6f1e3, 0.35);
  for (let i = 0; i < 36; i += 2) { const a0 = i / 36 * TAU, a1 = (i + 1) / 36 * TAU; g.beginPath(); g.arc(C, C, DOCK_R, a0, a1); g.strokePath(); }
  g.fillStyle(0x5fb3bf, 0.5); g.fillCircle(C, C, PORT_ISLAND_R + 28);
  g.fillStyle(0xe3cf96, 1); g.fillCircle(C, C, PORT_ISLAND_R);
  g.fillStyle(0x8f8a7e, 1); g.fillCircle(C, C, PORT_ISLAND_R - 22);
  for (const [a, len] of [[0, 70], [Math.PI / 2, 60], [Math.PI, 70], [-Math.PI / 2, 60]]) {
    const x = C + Math.cos(a) * (PORT_ISLAND_R - 6), y = C + Math.sin(a) * (PORT_ISLAND_R - 6);
    const ex = x + Math.cos(a) * len, ey = y + Math.sin(a) * len, nx = -Math.sin(a) * 9, ny = Math.cos(a) * 9;
    g.fillStyle(0x7a4f2a, 1);
    g.fillPoints([{ x: x + nx, y: y + ny }, { x: ex + nx, y: ey + ny }, { x: ex - nx, y: ey - ny }, { x: x - nx, y: y - ny }], true);
  }
  const roofs = [0xa8432e, 0x8b3524, 0xb8603a, 0x6e2c1e, 0xa8432e, 0x8b3524];
  for (let i = 0; i < 6; i++) { const a = i / 6 * TAU + 0.4, d = 38; g.fillStyle(roofs[i], 1); g.fillRect(C + Math.cos(a) * d - 11, C + Math.sin(a) * d - 9, 22, 18); }
  g.fillStyle(0xd9cfb8, 1); g.fillCircle(C, C, 12);
  g.generateTexture("harbor", C * 2, C * 2); g.destroy();
  sc.add.image(PORT.x, PORT.y, "harbor").setDepth(1);
  harborLabel = sc.add.text(PORT.x, PORT.y + PORT_ISLAND_R + 44, t("harborMap"), { fontFamily: UI_FONT, fontSize: "18px", fontStyle: "700", color: "#f6f1e3" })
    .setOrigin(0.5).setAlpha(0.7).setDepth(1);
}

// ---------- Ships ----------
function makeShip(sc, tex, x, y) {
  const spr = sc.add.image(x, y, tex).setDepth(5);
  return { spr, x, y, rot: rand(0, TAU), speed: 0, vx: 0, vy: 0, alive: true, burnT: 0, burnDps: 0, burnFx: 0, wakeT: 0, turnRate: 2.2 };
}
function playerGuns() {
  const mk = id => { const g = GUNS[id], m = gunLvMul(save.gunLv[id]);
    return { id, dmg: g.dmg * m, burn: g.burn ? g.burn * m : 0, range: g.range, interval: 60 / g.rpm, cd: 0 }; };
  return Object.fromEntries(MOUNTS.map(({ key }) => [key, save[key].map(mk)]));
}
function applyPlayerStats(full) {
  player.maxHp = yardVal("hull");
  if (full) player.hp = player.maxHp;
  player.maxSpeed = yardVal("sails");
  player.cap = yardVal("hold");
  player.guns = playerGuns();
}
function makePlayer(sc) {
  const p = makeShip(sc, "ship-player", PORT.x + 140, PORT.y);
  p.isPlayer = true; p.rot = 0; p.turnRate = 2.5; p.spr.setDepth(6);
  player = p; applyPlayerStats(true);
  return p;
}
function spawnEnemy(sc) {
  let x, y, ok = false;
  for (let t = 0; t < 40 && !ok; t++) {
    x = rand(150, W - 150); y = rand(150, H - 150);
    ok = Math.hypot(x - PORT.x, y - PORT.y) > SAFE_R + 120 &&
         (!player || Math.hypot(x - player.x, y - player.y) > 750) &&
         !islands.some(i => Math.hypot(i.x - x, i.y - y) < i.r * 1.3 + 40);
  }
  if (!ok) return;
  const d = Math.hypot(x - PORT.x, y - PORT.y);
  const L = clamp(1 + Math.floor((d - SAFE_R) / ZONE_STEP) + Math.floor(rand(-1, 2)), 1, 14);
  const merchant = Math.random() < 0.35;
  const tex = merchant ? "ship-merchant" : (Math.random() < 0.5 ? "ship-pirate" : "ship-navy");
  const st = enemyStats(L, merchant);
  const e = makeShip(sc, tex, x, y);
  Object.assign(e, { L, merchant, maxHp: st.hp, hp: st.hp, maxSpeed: st.speed, loot: st.loot, aimLead: st.lead, aimSpread: st.spread, angry: 0, thinkT: 0, wander: null, turnRate: 1.7,
    faction: merchant ? "merchant" : tex === "ship-pirate" ? "pirate" : "navy",
    target: null, chaseFrom: null, retarget: rand(0, 0.5), attacker: null, ignore: new Map() });
  const mk = () => ({ dmg: st.dmg, burn: 0, range: st.range, interval: st.interval, cd: rand(0.5, 2.2) });
  e.guns = { left: Array.from({ length: st.per }, mk), right: Array.from({ length: st.per }, mk) };
  e.badge = sc.add.text(x, y - 36, "", { fontFamily: UI_FONT, fontSize: "13px", fontStyle: "700", color: "#1b1410", padding: { x: 5, y: 1 } })
    .setOrigin(0.5).setDepth(9);
  refreshBadge(e);
  enemies.push(e);
}
function refreshBadge(e) {
  const c = threatColor(e.L);
  e.badge.setText(t("badge", { n: e.L, g: fmt(e.loot) })).setBackgroundColor(c).setColor(c === "#d9493a" ? "#fff6ea" : "#1b1410");
}

// ---------- Steering & AI ----------
function steer(s, desired, thr, dt) {
  const turn = s.turnRate * dt * (0.45 + 0.55 * Math.min(1, s.speed / s.maxSpeed + 0.2));
  if (desired != null) s.rot += clamp(angDiff(desired, s.rot), -turn, turn);
  const target = thr * s.maxSpeed;
  s.speed += clamp(target - s.speed, -s.maxSpeed * 1.1 * dt, s.maxSpeed * 0.7 * dt);
}
function avoidIslands(s, desired) {
  const lx = s.x + Math.cos(s.rot) * 120, ly = s.y + Math.sin(s.rot) * 120;
  for (const isl of islands) {
    if (Math.hypot(isl.x - lx, isl.y - ly) < isl.r * 1.05 + 45) {
      const cross = Math.cos(s.rot) * (isl.y - s.y) - Math.sin(s.rot) * (isl.x - s.x);
      return s.rot - Math.sign(cross || 1) * 1.3;
    }
  }
  return desired;
}
// Who fights whom:
//   pirate -> attacks everyone that is not a pirate (player, navy, merchants)
//   navy   -> attacks pirates and the player
//   merchant -> attacks nobody; runs from pirates and the player, fires back at whoever shot it
// Anyone fights back against the ship that last hit it.
const LEASH = 900;          // an AI gives up once it has sailed this far from where the chase began and still cannot reach
const GIVE_UP_DIST = 1300;  // ...or as soon as the target is this far away
const IGNORE_TIME = 10;     // seconds an AI ignores a target it gave up on
const inSafe = s => Math.hypot(s.x - PORT.x, s.y - PORT.y) < SAFE_R * 0.6;
function isHostile(e, o) {
  if (!o || o === e || !o.alive) return false;
  if (o.isPlayer && (docked || inSafe(o))) return false;
  if (e.attacker === o && e.angry > 0) return true;
  const g = o.isPlayer ? "player" : o.faction;
  if (e.faction === "pirate") return g !== "pirate";
  if (e.faction === "navy") return g === "pirate" || g === "player";
  return false;
}
const ignoring = (e, o, now) => (e.ignore.get(o) || 0) > now;
function pickTarget(e, now) {
  const aggro = 520 + e.L * 15;
  let best = null, bd = 1e9;
  for (const o of enemies.concat([player])) {
    if (!isHostile(e, o) || ignoring(e, o, now)) continue;
    const d = dist(e, o), lim = e.attacker === o && e.angry > 0 ? 1100 : aggro;
    if (d < lim && d < bd) { best = o; bd = d; }
  }
  return best;
}
function onScreen(x, y, pad = 60) { const v = S.cameras.main.worldView; return x > v.x - pad && x < v.right + pad && y > v.y - pad && y < v.bottom + pad; }
function giveUp(e, tg, now) {
  e.ignore.set(tg, now + IGNORE_TIME);
  if (e.attacker === tg) e.angry = 0;
  e.target = null;
  e.wander = { ...e.chaseFrom }; e.thinkT = rand(6, 10);     // head back toward where the chase began
  if (onScreen(e.x, e.y)) floatText(e.x, e.y - 48, t("gaveUp"), "#c9d6da", 14);
}
function think(e, dt) {
  const now = S.time.now / 1000;
  e.angry = Math.max(0, e.angry - dt);
  if (e.target && (!isHostile(e, e.target) || ignoring(e, e.target, now))) e.target = null;
  e.retarget -= dt;
  if (e.retarget <= 0) {
    e.retarget = 0.5;
    const nt = pickTarget(e, now);
    if (nt && nt !== e.target) { e.target = nt; e.chaseFrom = { x: e.x, y: e.y }; }
  }
  let desired = null, thr = 0.55;
  const tg = e.target;
  if (tg) {
    const d = dist(e, tg), toT = Math.atan2(tg.y - e.y, tg.x - e.x);
    const range = e.guns.left[0]?.range ?? 250;
    const chased = Math.hypot(e.x - e.chaseFrom.x, e.y - e.chaseFrom.y);
    if ((chased > LEASH && d > range) || d > GIVE_UP_DIST) giveUp(e, tg, now);
    else if (e.merchant) { desired = toT + Math.PI + Math.sin(now * 1.1 + e.L) * 0.5; thr = 1; }
    else if (d > range * 0.85) { desired = toT; thr = 1; }
    else {
      // present a broadside: run perpendicular to the target, side chosen by current heading
      const a1 = toT + Math.PI / 2, a2 = toT - Math.PI / 2;
      desired = Math.abs(angDiff(a1, e.rot)) < Math.abs(angDiff(a2, e.rot)) ? a1 : a2;
      if (d < range * 0.45) desired += (desired === a1 ? 0.35 : -0.35);
      thr = 0.75;
    }
  }
  if (desired == null && e.merchant) {
    // merchants run from any pirate or the player that comes close, even before a shot is fired
    let threat = null, td = 480;
    for (const o of enemies.concat([player])) {
      if (!o.alive || o === e || !(o.isPlayer ? !docked && !inSafe(o) : o.faction === "pirate")) continue;
      const d = dist(e, o); if (d < td) { threat = o; td = d; }
    }
    if (threat) { desired = Math.atan2(e.y - threat.y, e.x - threat.x) + Math.sin(now * 1.1 + e.L) * 0.5; thr = 1; }
  }
  if (desired == null) {
    e.thinkT -= dt;
    if (!e.wander || e.thinkT <= 0 || Math.hypot(e.wander.x - e.x, e.wander.y - e.y) < 80) {
      e.thinkT = rand(5, 10);
      e.wander = { x: clamp(e.x + rand(-700, 700), 200, W - 200), y: clamp(e.y + rand(-700, 700), 200, H - 200) };
    }
    desired = Math.atan2(e.wander.y - e.y, e.wander.x - e.x); thr = 0.5;
  }
  // stay out of the harbor's safe waters
  const dPort = Math.hypot(e.x - PORT.x, e.y - PORT.y);
  if (dPort < SAFE_R + 60) { desired = Math.atan2(e.y - PORT.y, e.x - PORT.x); thr = 0.8; }
  desired = avoidIslands(e, desired);
  steer(e, desired, thr, dt);
}

function move(s, dt) {
  s.vx = Math.cos(s.rot) * s.speed; s.vy = Math.sin(s.rot) * s.speed;
  s.x = clamp(s.x + s.vx * dt, 60, W - 60); s.y = clamp(s.y + s.vy * dt, 60, H - 60);
  // islands are solid
  const solid = islands.concat([{ x: PORT.x, y: PORT.y, r: PORT_ISLAND_R / 0.9 }]);
  for (const isl of solid) {
    const dx = s.x - isl.x, dy = s.y - isl.y, d = Math.hypot(dx, dy), R = isl.r * 0.9 + 18;
    if (d < R && d > 0.01) { s.x = isl.x + dx / d * R; s.y = isl.y + dy / d * R; s.speed *= 0.9; }
  }
}

// ---------- Combat ----------
function fire(s, targets, dt) {
  for (const side of [-1, 1]) {
    const arr = side < 0 ? s.guns.left : s.guns.right;
    const normal = s.rot + side * Math.PI / 2;
    const n = arr.length;
    arr.forEach((g, i) => {
      g.cd -= dt; if (g.cd > 0) return;
      let best = null, bd = 1e9;
      for (const t of targets) {
        if (!t.alive) continue;
        const dx = t.x - s.x, dy = t.y - s.y, d = Math.hypot(dx, dy);
        if (d > g.range || d >= bd) continue;
        if (Math.abs(angDiff(Math.atan2(dy, dx), normal)) > ARC) continue;
        best = t; bd = d;
      }
      if (!best) { g.cd = 0; return; }
      const off = n === 1 ? 0 : -18 + 36 * i / (n - 1);
      const mx = s.x + Math.cos(s.rot) * off + Math.cos(normal) * 13;
      const my = s.y + Math.sin(s.rot) * off + Math.sin(normal) * 13;
      const lead = s.isPlayer ? 1 : s.aimLead, t = bd / BALL_SPEED;
      const tx = best.x + best.vx * t * lead, ty = best.y + best.vy * t * lead;
      const ang = Math.atan2(ty - my, tx - mx) + rand(-1, 1) * (s.isPlayer ? 0.05 : s.aimSpread);
      const life = g.range * 1.08 / BALL_SPEED;
      const spr = S.add.image(mx, my, "ball").setDepth(7);
      balls.push({ spr, x: mx, y: my, vx: Math.cos(ang) * BALL_SPEED + s.vx * 0.3, vy: Math.sin(ang) * BALL_SPEED + s.vy * 0.3,
        life, life0: life, dmg: g.dmg, burn: g.burn, fromPlayer: !!s.isPlayer, owner: s });
      S.fx.smoke.emitParticleAt(mx + Math.cos(normal) * 6, my + Math.sin(normal) * 6, 3);
      g.cd = g.interval * rand(0.85, 1.15);
    });
  }
}
// ---------- Player gunnery: straight aim lines, fire on release ----------
// Each cannon shoots straight out of its mount: bow guns forward, broadside guns perpendicular to the hull,
// stern guns aft. No auto-aim and no lead: the ball flies exactly along the line that was shown,
// so the player aims by turning the ship.
const AIM_SHOW_PAD = 1.15;   // aim lines appear when an enemy is within (range x this) of a mount's firing arc
let prevKeyActive = false, engagedPrev = false, releaseTips = 0;
function muzzle(s, m, i, n) {
  const a = s.rot + m.ang, p = s.rot + m.perp, off = n === 1 ? 0 : -m.span / 2 + m.span * i / (n - 1);
  return { x: s.x + Math.cos(p) * off + Math.cos(a) * m.out, y: s.y + Math.sin(p) * off + Math.sin(a) * m.out, a };
}
// Is an enemy inside this mount's firing arc? Only then are its aim lines shown and can it fire.
function mountEngaged(m) {
  const arr = player.guns[m.key];
  if (!arr.length) return false;
  const r = Math.max(...arr.map(g => g.range)) * AIM_SHOW_PAD, normal = player.rot + m.ang;
  return enemies.some(e => e.alive && dist(e, player) < r && Math.abs(angDiff(Math.atan2(e.y - player.y, e.x - player.x), normal)) < ARC);
}
// Would a straight shot from (x, y) at angle a, length len, pass through an enemy hull right now?
function lineHits(x, y, a, len) {
  const c = Math.cos(a), sn = Math.sin(a);
  for (const e of enemies) {
    if (!e.alive) continue;
    const ex = e.x - x, ey = e.y - y, along = ex * c + ey * sn;
    if (along < -30 || along > len + 30 || Math.abs(ex * sn - ey * c) > 45) continue;   // cheap reject
    for (let d = Math.max(0, along - 40); d <= Math.min(len, along + 40); d += 6) if (hitShip(e, x + c * d, y + sn * d)) return true;
  }
  return false;
}
// Fire every loaded cannon on each engaged mount. Called when the player lets go.
function playerFire() {
  if (paused || docked || !player.alive) return;
  let shots = 0;
  for (const mount of MOUNTS) {
    if (!mountEngaged(mount)) continue;
    const arr = player.guns[mount.key];
    arr.forEach((g, i) => {
      if (g.cd > 0) return;
      g.cd = g.interval;
      S.time.delayedCall(shots++ * 70, () => {          // a rolling broadside, not one blast
        if (!player.alive || paused) return;
        const m = muzzle(player, mount, i, arr.length), life = g.range / BALL_SPEED;
        balls.push({ spr: S.add.image(m.x, m.y, "ball").setDepth(7), x: m.x, y: m.y,
          vx: Math.cos(m.a) * BALL_SPEED, vy: Math.sin(m.a) * BALL_SPEED, life, life0: life, dmg: g.dmg, burn: g.burn, fromPlayer: true, owner: player });
        S.fx.smoke.emitParticleAt(m.x + Math.cos(m.a) * 6, m.y + Math.sin(m.a) * 6, 3);
      });
    });
  }
  if (shots) S.cameras.main.shake(70, 0.002);
}

// ship hit test: capsule along the hull axis
function hitShip(s, x, y) {
  const dx = x - s.x, dy = y - s.y, c = Math.cos(s.rot), sn = Math.sin(s.rot);
  const along = clamp(dx * c + dy * sn, -28, 28);
  return Math.hypot(dx - c * along, dy - sn * along) < 13;
}
function floatText(x, y, str, color, size = 16) {
  const t = S.add.text(x, y, str, { fontFamily: UI_FONT, fontSize: size + "px", fontStyle: "700", color, stroke: "#0b2530", strokeThickness: 4 })
    .setOrigin(0.5).setDepth(10);
  S.tweens.add({ targets: t, y: y - 34, alpha: 0, duration: 900, ease: "Cubic.easeOut", onComplete: () => t.destroy() });
}
function hurt(s, dmg, burn, src) {
  if (!s.alive) return;
  s.hp -= dmg;
  if (burn) { s.burnT = 3; s.burnDps = burn; s.burnSrc = src; }
  s.spr.setTint(0xffb4a0); S.time.delayedCall(90, () => s.spr && s.spr.clearTint());
  if (onScreen(s.x, s.y)) {
    const byPlayer = src === player;
    floatText(s.x + rand(-10, 10), s.y - 22, Math.round(dmg), s.isPlayer ? "#ff8a75" : byPlayer ? "#fff4d6" : "#a9c3cb", byPlayer || s.isPlayer ? 16 : 13);
  }
  if (!s.isPlayer && src) { s.attacker = src; s.angry = 8; s.ignore.delete(src); }
  if (s.isPlayer) S.cameras.main.shake(90, 0.004);
  if (s.hp <= 0) sink(s, src);
}
// A crate floating on the sea. AI loot is temporary; a player wreck is saved and never expires.
function addCrate(x, y, value, wreck) {
  const c = { spr: S.add.image(x, y, wreck ? "wreck" : "crate").setDepth(2), x, y, value, t: 0, wreck: wreck || null, label: null };
  if (wreck) c.label = S.add.text(x, y - 26, t("wreckLabel"), { fontFamily: UI_FONT, fontSize: "13px", fontStyle: "700", color: "#ffd8cf", stroke: "#0b2530", strokeThickness: 4 })
    .setOrigin(0.5).setDepth(9);
  crates.push(c);
  return c;
}
let lastLost = 0;
function sink(s, killer) {
  if (!s.alive) return;
  s.alive = false; s.speed = 0; s.hp = 0;
  S.fx.spark.explode(26, s.x, s.y); S.fx.smoke.explode(14, s.x, s.y);
  if (s.badge) { s.badge.destroy(); s.badge = null; }
  S.tweens.add({ targets: s.spr, alpha: 0, scale: 0.6, angle: s.spr.angle + 25, duration: 1300, ease: "Quad.easeIn",
    onComplete: () => { if (!s.isPlayer) { s.spr.destroy(); s.dead = true; } } });
  if (s.isPlayer) {
    // the hold's cargo stays where the ship went down, and survives closing the game
    lastLost = Math.round(cargo);
    if (lastLost > 0) { const w = { x: Math.round(s.x), y: Math.round(s.y), value: lastLost }; save.wrecks.push(w); addCrate(w.x, w.y, w.value, w); }
    cargo = 0; persist();
    toast(t(lastLost > 0 ? "toastSunkWreck" : "toastSunk"));
    S.time.delayedCall(1700, () => {
      cargo = 0;
      Object.assign(player, { x: PORT.x + 140, y: PORT.y, rot: 0, speed: 0, alive: true, burnT: 0 });
      player.spr.setAlpha(1).setScale(1).setAngle(0).setPosition(player.x, player.y);
      dock("sunk");
    });
  } else {
    addCrate(s.x, s.y, s.loot, null);     // whoever sank it, the loot floats here (not saved)
    if (killer === player) { save.sunk++; floatText(s.x, s.y - 30, t("fSunk"), "#f0c766", 20); }
  }
}

// ---------- Harbor ----------
function dock(kind) {
  paused = true; docked = true;
  const sold = cargo;
  save.gold += cargo; cargo = 0;
  applyPlayerStats(true);
  player.speed = 0; player.burnT = 0;
  persist();
  // keep the message as a key so it re-renders when the language changes
  if (kind === "welcome") portMsg = [save.sunk === 0 ? "welcome" : "welcomeBack"];
  else if (kind === "sunk") portMsg = lastLost > 0 ? ["sunkWreck", { n: fmt(lastLost) }] : ["sunkMsg"];
  else portMsg = sold > 0 ? ["sold", { n: fmt(sold) }] : ["empty"];
  renderPort();
  document.getElementById("port").hidden = false;
  document.getElementById("joy").hidden = true; joyVec = { x: 0, y: 0, m: 0 };
}
function setSail() {
  document.getElementById("port").hidden = true;
  docked = false; paused = false; canDock = false;
  enemies.forEach(e => e.badge && refreshBadge(e));
}

let portMsg = ["welcome"];
// Buying a ship wipes its yard upgrades, so the button needs a second tap within a few seconds.
let shipArmed = null, shipArmedAt = 0, shipArmTimer;
function renderPort() {
  const $ = id => document.getElementById(id);
  $("pMsg").innerHTML = t(...portMsg);
  $("pGold").textContent = fmt(save.gold);
  $("pStats").innerHTML = `<span><b>${t("s_" + save.ship)}</b></span><span>${t("statLv", { n: shipRating() })}</span><span><b>${YARD.hull.show(yardVal("hull"))}</b></span>` +
    `<span><b>${YARD.sails.show(yardVal("sails"))}</b></span><span>${t("statHold", { n: fmt(yardVal("hold")) })}</span><span>${t("statSunk", { n: save.sunk })}</span>`;
  // gun deck diagram: one row per mount the ship has
  const slotRow = (side, label) => {
    if (!save[side].length) return "";
    const btns = save[side].map((id, i) =>
      `<button class="slot" type="button" data-act="slot" data-side="${side}" data-i="${i}" aria-label="${t("slotAria", { side: label, n: i + 1, gun: t("gf_" + id) })}">${t("g_" + id)}<small>Lv ${save.gunLv[id]}</small></button>`).join("");
    return `<div class="row"><div class="lbl">${label}</div><div class="slots">${btns}</div></div>`;
  };
  $("deck").innerHTML = slotRow("bow", t("bow")) + slotRow("left", t("larboard")) + `<div class="hullbar" aria-hidden="true"></div>` +
    slotRow("right", t("starboard")) + slotRow("stern", t("stern"));
  // armory
  $("armory").innerHTML = GUN_ORDER.map(id => {
    const g = GUNS[id], lv = save.gunLv[id], m = gunLvMul(lv), owned = save.unlocked[id];
    const dmgTxt = t("dmg", { n: Math.round(g.dmg * m) }) + (g.burn ? t("burn", { n: Math.round(g.burn * m * 3) }) : "");
    let btn;
    if (!owned) btn = `<button class="btn" type="button" data-act="buy" data-id="${id}" ${save.gold < g.cost ? "disabled" : ""}>${t("buy", { n: fmt(g.cost) })}</button>`;
    else if (lv >= GUN_MAX) btn = `<button class="btn max" type="button" disabled>${t("max")}</button>`;
    else { const c = gunUpCost(id); btn = `<button class="btn" type="button" data-act="up" data-id="${id}" ${save.gold < c ? "disabled" : ""}>${t("upgrade", { n: fmt(c) })}</button>`; }
    const next = owned && lv < GUN_MAX ? ` <span class="up">→ ${Math.round(g.dmg * gunLvMul(lv + 1))}</span>` : "";
    return `<div class="item"><div class="nm">${t("gf_" + id)}<small>${owned ? "Lv " + lv : t("notOwned")}</small></div>${btn}
      <div class="ds">${dmgTxt}${next} · ${t("range", { n: g.range })} · ${t("rpm", { n: g.rpm })} · ${t("gn_" + id)}</div></div>`;
  }).join("");
  // shipwright
  $("yard").innerHTML = Object.entries(YARD).map(([k, y]) => {
    const lv = save[k], cur = y.show(yardVal(k));
    let btn, ds;
    if (lv >= y.max) { btn = `<button class="btn max" type="button" disabled>${t("max")}</button>`; ds = `<b>${cur}</b>`; }
    else { const c = y.cost(lv); btn = `<button class="btn" type="button" data-act="yard" data-k="${k}" ${save.gold < c ? "disabled" : ""}>${t("upgrade", { n: fmt(c) })}</button>`;
      ds = `<b>${cur}</b> <span class="up">→ ${y.show(yardVal(k, lv + 1))}</span>`; }
    return `<div class="item"><div class="nm">${t("y_" + k)}<small>Lv ${lv}</small></div>${btn}<div class="ds">${ds}</div></div>`;
  }).join("");
  // ships: the current one and every bigger one (buying replaces the current ship)
  $("ships").innerHTML = SHIP_ORDER.slice(SHIP_ORDER.indexOf(save.ship)).map(id => {
    const sh = SHIPS[id];
    const btn = id === save.ship ? `<button class="btn max" type="button" disabled>${t("yourShip")}</button>`
      : `<button class="btn" type="button" data-act="ship" data-id="${id}" ${save.gold < sh.cost ? "disabled" : ""}>${shipArmed === id ? t("shipArm") : t("buy", { n: fmt(sh.cost) })}</button>`;
    const ds = t("shipDs", { b: sh.slots.bow, s: sh.slots.left, t: sh.slots.stern,
      hp: YARD.hull.show(yardVal("hull", 1, sh)), kn: YARD.sails.show(yardVal("sails", 1, sh)), cargo: fmt(yardVal("hold", 1, sh)) });
    return `<div class="item"><div class="nm">${t("s_" + id)}</div>${btn}<div class="ds">${ds}</div></div>`;
  }).join("");
}

document.getElementById("port").addEventListener("click", ev => {
  const b = ev.target.closest("[data-act]"); if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act === "slot") {
    const owned = GUN_ORDER.filter(id => save.unlocked[id]);
    const arr = save[b.dataset.side], i = +b.dataset.i;
    arr[i] = owned[(owned.indexOf(arr[i]) + 1) % owned.length];
  } else if (act === "buy") {
    const id = b.dataset.id; save.gold -= GUNS[id].cost; save.unlocked[id] = true;
    portMsg = ["bought", { gun: t("gf_" + id) }];
  } else if (act === "up") {
    const id = b.dataset.id; save.gold -= gunUpCost(id); save.gunLv[id]++;
  } else if (act === "yard") {
    const k = b.dataset.k; save.gold -= YARD[k].cost(save[k]); save[k]++;
  } else if (act === "ship") {
    const id = b.dataset.id;
    if (shipArmed === id && performance.now() - shipArmedAt < 400) return;   // a double-click is not a second tap
    clearTimeout(shipArmTimer);
    if (shipArmed !== id) {
      shipArmed = id; shipArmedAt = performance.now();
      shipArmTimer = setTimeout(() => {
        shipArmed = null;   // relabel in place rather than re-render, so keyboard focus stays put
        const el = document.querySelector(`[data-act="ship"][data-id="${id}"]`);
        if (el) el.textContent = t("buy", { n: fmt(SHIPS[id].cost) });
      }, 3000);
      renderPort(); document.querySelector(`[data-act="ship"][data-id="${id}"]`)?.focus();
      return;
    }
    shipArmed = null;
    save = fitMounts({ ...save, gold: save.gold - SHIPS[id].cost, ship: id, hull: 1, sails: 1, hold: 1 });
    portMsg = ["boughtShip", { ship: t("s_" + id) }];
  }
  applyPlayerStats(true); persist(); renderPort(); hud(true);
  // keep focus on the same control after re-render (keyboard users)
  const sel = act === "slot" ? `[data-act="slot"][data-side="${b.dataset.side}"][data-i="${b.dataset.i}"]`
    : act === "ship" ? `#ships [data-act="ship"]:not(:disabled), #sail` : null;
  if (sel) document.querySelector(sel)?.focus();
});
document.getElementById("sail").addEventListener("click", setSail);
const resetBtn = document.getElementById("reset");
let resetArmed = false;
resetBtn.addEventListener("click", () => {
  if (!resetArmed) { resetArmed = true; resetBtn.textContent = t("resetArm"); setTimeout(() => { resetArmed = false; resetBtn.textContent = t("reset"); }, 3000); return; }
  save = defaultSave(); persist(); resetArmed = false; resetBtn.textContent = t("reset");
  for (let i = crates.length - 1; i >= 0; i--) if (crates[i].wreck) { crates[i].spr.destroy(); crates[i].label?.destroy(); crates.splice(i, 1); }
  applyPlayerStats(true); dock("welcome"); hud(true);
});

// ---------- HUD ----------
let toastTimer;

const mini = document.getElementById("mini"), mctx = mini.getContext("2d");
let miniBase;
function buildMiniBase() {
  miniBase = document.createElement("canvas"); miniBase.width = miniBase.height = 224;
  const c = miniBase.getContext("2d"), k = 224 / W;
  c.fillStyle = "#0f3f52"; c.fillRect(0, 0, 224, 224);
  c.strokeStyle = "rgba(0,0,0,.25)"; c.lineWidth = 1;
  for (let i = 1; i <= 9; i++) { c.beginPath(); c.arc(PORT.x * k, PORT.y * k, (SAFE_R + 80 + i * ZONE_STEP * 1.5) * k, 0, TAU); c.stroke(); }
  c.fillStyle = "#e3cf96"; for (const i of islands) { c.beginPath(); c.arc(i.x * k, i.y * k, Math.max(2, i.r * k), 0, TAU); c.fill(); }
  c.fillStyle = "#f6f1e3"; c.beginPath(); c.arc(PORT.x * k, PORT.y * k, 5, 0, TAU); c.fill();
}
function drawMini() {
  const k = 224 / W;
  mctx.save(); mctx.beginPath(); mctx.arc(112, 112, 112, 0, TAU); mctx.clip();
  mctx.drawImage(miniBase, 0, 0);
  for (const c of crates) if (!c.wreck) { mctx.fillStyle = "#f0c766"; mctx.fillRect(c.x * k - 2, c.y * k - 2, 4, 4); }
  mctx.strokeStyle = "#ff5a3c"; mctx.lineWidth = 2.5;
  for (const c of crates) if (c.wreck) { const x = c.x * k, y = c.y * k;
    mctx.beginPath(); mctx.moveTo(x - 5, y - 5); mctx.lineTo(x + 5, y + 5); mctx.moveTo(x + 5, y - 5); mctx.lineTo(x - 5, y + 5); mctx.stroke(); }
  for (const e of enemies) if (e.alive) { mctx.fillStyle = threatColor(e.L); mctx.beginPath(); mctx.arc(e.x * k, e.y * k, 3, 0, TAU); mctx.fill(); }
  const px = player.x * k, py = player.y * k;
  mctx.translate(px, py); mctx.rotate(player.rot); mctx.fillStyle = "#fff";
  mctx.beginPath(); mctx.moveTo(7, 0); mctx.lineTo(-5, -4.5); mctx.lineTo(-5, 4.5); mctx.closePath(); mctx.fill();
  mctx.restore();
}

// ---------- Input: floating joystick (touch + mouse) ----------
(function joystick() {
  const area = document.getElementById("game"), joy = document.getElementById("joy"), knob = joy.firstElementChild;
  let id = null, ox = 0, oy = 0;
  const R = 50;
  area.addEventListener("pointerdown", e => {
    if (paused || id !== null) return;
    id = e.pointerId; ox = e.clientX; oy = e.clientY;
    area.setPointerCapture(id);
    joy.style.left = ox + "px"; joy.style.top = oy + "px"; joy.hidden = false;
    knob.style.transform = "translate(0,0)";
  });
  area.addEventListener("pointermove", e => {
    if (e.pointerId !== id) return;
    let dx = e.clientX - ox, dy = e.clientY - oy; const d = Math.hypot(dx, dy);
    if (d > R) { dx = dx / d * R; dy = dy / d * R; }
    knob.style.transform = `translate(${dx}px,${dy}px)`;
    joyVec = { x: dx / R, y: dy / R, m: Math.min(1, d / R) };
  });
  const end = (e, shoot) => { if (e.pointerId !== id) return; id = null; joy.hidden = true; joyVec = { x: 0, y: 0, m: 0 }; if (shoot) playerFire(); };
  area.addEventListener("pointerup", e => end(e, true)); area.addEventListener("pointercancel", e => end(e, false));
})();
const isTouch = matchMedia("(pointer: coarse)").matches;

// Apply the current language to every static label, the HUD, the harbor ledger and in-world texts.
function applyLang() {
  document.documentElement.lang = lang === "zh" ? "zh-Hant" : "en";
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-lang-toggle]").forEach(el => { el.textContent = t("langBtn"); el.setAttribute("aria-label", lang === "zh" ? "Switch to English" : "切換成中文"); });
  document.getElementById("hint").textContent = t(isTouch ? "hintTouch" : "hintDesk");
  if (player) { hud(true); renderPort(); enemies.forEach(e => e.badge && refreshBadge(e)); }
  if (harborLabel) harborLabel.setText(t("harborMap"));
  for (const c of crates) c.label?.setText(t("wreckLabel"));
}
document.querySelectorAll("[data-lang-toggle]").forEach(el => el.addEventListener("click", () => {
  lang = lang === "zh" ? "en" : "zh";
  try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
  applyLang();
}));
applyLang();

// ---------- Scene ----------
class Main extends Phaser.Scene {
  constructor() { super("main"); }
  create() {
    S = this;
    islands = genIslands();
    makeTextures(this);
    const cam = this.cameras.main;
    cam.setBackgroundColor("#155a73").setBounds(0, 0, W, H);
    this.sea1 = this.add.tileSprite(0, 0, 16, 16, "wave").setOrigin(0).setDepth(0).setAlpha(0.36);
    this.sea2 = this.add.tileSprite(0, 0, 16, 16, "wave").setOrigin(0).setDepth(0).setAlpha(0.18).setTileScale(1.7);
    drawWorld(this);
    this.fx = {
      wake:   this.add.particles(0, 0, "puff", { lifespan: 1500, speed: 0, scale: { start: 0.6, end: 1.8 }, alpha: { start: 0.45, end: 0 }, emitting: false }).setDepth(3),
      smoke:  this.add.particles(0, 0, "puff", { lifespan: 800, speed: { min: 10, max: 45 }, scale: { start: 0.8, end: 2.2 }, alpha: { start: 0.8, end: 0 }, tint: 0xdedad0, emitting: false }).setDepth(8),
      spark:  this.add.particles(0, 0, "dot", { lifespan: 450, speed: { min: 60, max: 200 }, scale: { start: 1, end: 0 }, tint: [0xffd27a, 0xff8a3a, 0xff5a2a], blendMode: "ADD", emitting: false }).setDepth(8),
      splash: this.add.particles(0, 0, "dot", { lifespan: 550, speed: { min: 30, max: 90 }, scale: { start: 0.9, end: 0.2 }, alpha: { start: 0.9, end: 0 }, tint: 0xe9f7fa, emitting: false }).setDepth(3),
    };
    this.arcG = this.add.graphics().setDepth(4);
    this.barG = this.add.graphics().setDepth(9);
    makePlayer(this);
    cam.startFollow(player.spr, true, 0.15, 0.15);
    this.keys = this.input.keyboard.addKeys("W,A,S,D,UP,DOWN,LEFT,RIGHT");
    this.input.keyboard.on("keydown-SPACE", () => playerFire());
    for (let i = 0; i < ENEMY_COUNT; i++) spawnEnemy(this);
    for (const w of save.wrecks) addCrate(w.x, w.y, w.value, w);
    const fit = () => cam.setZoom(clamp(Math.min(this.scale.width, this.scale.height) / 720, 0.55, 1.1));
    this.scale.on("resize", fit); fit();
    buildMiniBase();
    player.spr.setPosition(player.x, player.y);
    cam.centerOn(player.x, player.y);
    hud(true);
    dock("welcome");
  }
  update(_, deltaMs) {
    const dt = Math.min(deltaMs / 1000, 0.05);
    const v = this.cameras.main.worldView;
    for (const [ts, k] of [[this.sea1, 1], [this.sea2, 0.6]]) {
      const tw = Math.ceil(v.width + 128), th = Math.ceil(v.height + 128);
      if (ts.width !== tw || ts.height !== th) ts.setSize(tw, th);
      ts.setPosition(v.x - 64, v.y - 64);
      ts.tilePositionX = (v.x - 64) / ts.tileScaleX + this.time.now * 0.004 * k; ts.tilePositionY = (v.y - 64) / ts.tileScaleY + this.time.now * 0.002 * k;
    }
    if (!paused) step(dt);
    drawOverlays();
    hudT -= dt; if (hudT <= 0) { hud(); hudT = 0.1; }
    miniT -= dt; if (miniT <= 0) { drawMini(); miniT = 0.15; }
  }
}

function step(dt) {
  const K = S.keys;
  // --- player input ---
  if (player.alive) {
    let kx = (K.D.isDown || K.RIGHT.isDown) - (K.A.isDown || K.LEFT.isDown);
    let ky = (K.S.isDown || K.DOWN.isDown) - (K.W.isDown || K.UP.isDown);
    let ix = joyVec.x, iy = joyVec.y, m = joyVec.m;
    const keyActive = !!(kx || ky);
    if (prevKeyActive && !keyActive) playerFire();      // letting go of the keys fires, like letting go of the stick
    prevKeyActive = keyActive;
    if (kx || ky) { ix = kx; iy = ky; m = 1; }
    if (m > 0.2) { steer(player, Math.atan2(iy, ix), Math.min(1, m * 1.25), dt);
      if (!moved) { moved = true; document.getElementById("hint").style.opacity = 0; } }
    else steer(player, null, 0, dt);
  }
  // --- AI ---
  for (const e of enemies) if (e.alive) think(e, dt);
  // --- movement ---
  const ships = enemies.filter(e => e.alive); if (player.alive) ships.push(player);
  for (const s of ships) move(s, dt);
  for (let i = 0; i < ships.length; i++) for (let j = i + 1; j < ships.length; j++) {
    const a = ships[i], b = ships[j], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
    if (d < 40 && d > 0.01) { const p = (40 - d) / 2; a.x -= dx / d * p; a.y -= dy / d * p; b.x += dx / d * p; b.y += dy / d * p; }
  }
  for (const s of ships) {
    s.spr.setPosition(s.x, s.y).setRotation(s.rot);
    s.wakeT -= dt;
    if (s.speed > 25 && s.wakeT <= 0) { s.wakeT = 0.07; S.fx.wake.emitParticleAt(s.x - Math.cos(s.rot) * 30, s.y - Math.sin(s.rot) * 30, 1); }
    if (s.burnT > 0) { s.burnT -= dt; s.hp -= s.burnDps * dt; s.burnFx -= dt;
      if (s.burnFx <= 0) { s.burnFx = 0.08; S.fx.spark.emitParticleAt(s.x + rand(-20, 20), s.y + rand(-8, 8), 1); }
      if (s.hp <= 0) sink(s, s.burnSrc); }
    if (s.badge) s.badge.setPosition(s.x, s.y - 38);
  }
  // --- firing ---
  const living = enemies.filter(e => e.alive);
  for (const g of Object.values(player.guns).flat()) g.cd = Math.max(0, g.cd - dt);   // reload
  const engaged = player.alive && MOUNTS.some(mountEngaged);
  if (engaged && !engagedPrev && releaseTips < 3 && (joyVec.m > 0 || prevKeyActive)) { releaseTips++; toast(t("releaseTip")); }
  engagedPrev = engaged;
  for (const e of living) fire(e, e.target && isHostile(e, e.target) ? [e.target] : [], dt);
  // --- cannonballs ---
  for (let i = balls.length - 1; i >= 0; i--) {
    const b = balls[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    const p = 1 - b.life / b.life0;
    b.spr.setPosition(b.x, b.y).setScale(1 + Math.sin(Math.PI * clamp(p, 0, 1)) * 0.6);
    let hit = null;
    if (!b.fromPlayer && player.alive && hitShip(player, b.x, b.y)) hit = player;
    if (!hit) for (const e of living) if (e !== b.owner && e.alive && hitShip(e, b.x, b.y)) { hit = e; break; }
    const onRock = !hit && islands.some(isl => Math.hypot(isl.x - b.x, isl.y - b.y) < isl.r * 0.9);
    if (hit) { S.fx.spark.explode(10, b.x, b.y); hurt(hit, b.dmg, b.burn, b.owner); }
    if (hit || onRock || b.life <= 0) {
      if (!hit) S.fx.splash.explode(onRock ? 4 : 8, b.x, b.y);
      b.spr.destroy(); balls.splice(i, 1);
    }
  }
  // --- plunder crates ---
  for (let i = crates.length - 1; i >= 0; i--) {
    const c = crates[i]; c.t += dt;
    const d = dist(c, player), room = player.cap - cargo;
    if (player.alive && d < 150 && room > 0) { const k = Math.min(1, 260 * dt / Math.max(d, 1)); c.x += (player.x - c.x) * k; c.y += (player.y - c.y) * k; }
    if (player.alive && d < 32) {
      if (room > 0) { const take = Math.min(room, c.value); cargo += take; c.value -= take; floatText(c.x, c.y - 10, t("fCargo", { n: fmt(take) }), "#f0c766", 17);
        if (c.wreck) { c.wreck.value = c.value; if (c.value <= 0) save.wrecks = save.wrecks.filter(w => w !== c.wreck); persist(); } }
      else if (S.time.now - lastHoldToast > 3000) { lastHoldToast = S.time.now; toast(t("toastFull")); }
    }
    if (c.wreck) { c.wreck.x = Math.round(c.x); c.wreck.y = Math.round(c.y); }
    c.spr.setPosition(c.x, c.y + Math.sin(c.t * 3) * 2).setAlpha(!c.wreck && c.t > 55 ? clamp((60 - c.t) / 5, 0, 1) : 1);
    if (c.label) c.label.setPosition(c.x, c.y - 26);
    if (c.value <= 0 || (!c.wreck && c.t > 60)) { c.spr.destroy(); c.label?.destroy(); crates.splice(i, 1); }
  }
  // --- harbor ---
  const dPort = Math.hypot(player.x - PORT.x, player.y - PORT.y);
  if (!canDock && dPort > DOCK_R + 80) canDock = true;
  if (canDock && player.alive && dPort < DOCK_R) dock("return");
  // --- population ---
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.dead) { enemies.splice(i, 1); continue; }
    if (e.alive && e.angry <= 0 && dist(e, player) > 3000) { e.alive = false; e.spr.destroy(); e.badge.destroy(); enemies.splice(i, 1); }
  }
  spawnT -= dt;
  if (spawnT <= 0) { spawnT = 1.2; if (enemies.filter(e => e.alive).length < ENEMY_COUNT) spawnEnemy(S); }
}

function drawOverlays() {
  const g = S.arcG, bg = S.barG; g.clear(); bg.clear();
  const v = S.cameras.main.worldView;
  // Aim lines: hidden until an enemy nears a mount's firing arc. One straight line per cannon.
  //   red    = loaded, and the line passes through an enemy right now
  //   yellow = loaded, line misses
  //   faint  = reloading; the line grows back to full length as the gun reloads
  if (player.alive && !docked) {
    for (const mount of MOUNTS) {
      if (!mountEngaged(mount)) continue;
      const arr = player.guns[mount.key];
      arr.forEach((gun, i) => {
        const m = muzzle(player, mount, i, arr.length), ready = gun.cd <= 0;
        const len = gun.range * (ready ? 1 : 1 - gun.cd / gun.interval);
        const hit = ready && lineHits(m.x, m.y, m.a, gun.range);
        const col = !ready ? 0xf6f1e3 : hit ? 0xff4a2e : 0xffd76a, alpha = !ready ? 0.25 : hit ? 0.95 : 0.75;
        const c = Math.cos(m.a), sn = Math.sin(m.a);
        g.lineStyle(hit ? 3 : 2, col, alpha);
        for (let d = 0; d < len; d += 18) g.lineBetween(m.x + c * d, m.y + sn * d, m.x + c * Math.min(d + 11, len), m.y + sn * Math.min(d + 11, len));
        g.fillStyle(col, alpha); g.fillCircle(m.x + c * len, m.y + sn * len, ready ? 4 : 2.5);
      });
    }
  }
  // health bars
  for (const e of enemies) {
    if (!e.alive || e.x < v.x - 60 || e.x > v.right + 60 || e.y < v.y - 60 || e.y > v.bottom + 60) continue;
    const w = 46, x = e.x - w / 2, y = e.y - 27;
    bg.fillStyle(0x08222d, 0.8); bg.fillRect(x - 1, y - 1, w + 2, 6);
    bg.fillStyle(e.burnT > 0 ? 0xff8a3a : 0x86c46f, 1); bg.fillRect(x, y, w * clamp(e.hp / e.maxHp, 0, 1), 4);
  }
  if (player.alive && !docked && player.hp < player.maxHp) {
    const w = 50, x = player.x - w / 2, y = player.y - 30;
    bg.fillStyle(0x08222d, 0.8); bg.fillRect(x - 1, y - 1, w + 2, 6);
    bg.fillStyle(0xd45a43, 1); bg.fillRect(x, y, w * clamp(player.hp / player.maxHp, 0, 1), 4);
  }
}

// ---------- Boot ----------
function boot() {
  new Phaser.Game({
    type: Phaser.AUTO, parent: "game", backgroundColor: "#155a73",
    scale: { mode: Phaser.Scale.RESIZE, width: "100%", height: "100%" },
    render: { antialias: true }, scene: [Main],
  });
}
Promise.race([document.fonts ? document.fonts.ready : Promise.resolve(), new Promise(r => setTimeout(r, 1500))]).then(boot);
</script>
