# Run the full test suite (unit + browser tests) on every pull request and on pushes to main.
# The browser tests drive the system Google Chrome (channel "chrome") against a static server on :8765.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Start static server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8765/index.html >/dev/null && exit 0; sleep 0.5; done
          echo "server did not start"; exit 1
      - name: Run all tests
        run: npm run test:all
